---
layout: default
---
<section class="page-hero">
  {% include hero-art.html %}
  <div class="wrap">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </div>
</section>
<section class="section section--page">
  <div class="wrap prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </div>
</section>
