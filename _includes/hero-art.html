<svg class="waves" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8f9fd6"/>
      <stop offset=".5" stop-color="#e6a3c9"/>
      <stop offset="1" stop-color="#8f9fd6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#wg)" stroke-width="1.6">
    {%- for i in (0..13) %}
    {%- assign a = i | times: 9 | plus: 40 %}
    {%- assign b = 300 | minus: a %}
    <path class="w" style="--i:{{ i }}" d="M-50 150 C 150 {{ a }}, 350 {{ b }}, 600 150 S 1050 {{ a }}, 1250 150"/>
    {%- endfor %}
  </g>
</svg>
