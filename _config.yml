# -----------------------------------------------------------------------------
# Latini Group website: site settings
# Edit the values below. Content lives in _pages, _people, _projects, _news
# and _bibliography/papers.bib.
# -----------------------------------------------------------------------------

title: Latini Group
group_name: Latini Group
tagline: Light–Matter Engineering of Quantum Materials
description: >
  Theoretical condensed matter group at DTU Physics developing ab-initio methods
  for strong light–matter interaction, cavity materials engineering and
  non-equilibrium electron dynamics.
email: simola@dtu.dk
lang: en

url: https://nautasimola.github.io
baseurl: ""

# Where to find us (shown in the footer and contact section)
address:
  line1: Fysikvej, Building 309, Room 228
  line2: 2800 Kgs. Lyngby, Denmark
  map: https://goo.gl/maps/eGhozQDD9qWKDj4d6

# Affiliations (footer + home page)
affiliations:
  - name: DTU Physics
    full: Technical University of Denmark, Department of Physics
    url: https://physics.dtu.dk/research/sections/2dphys
  - name: MPSD Hamburg
    full: Max Planck Institute for the Structure and Dynamics of Matter, Theory Department (Partner Group)
    url: https://theory.mpsd.mpg.de/

# Social / academic profiles (leave blank to hide)
socials:
  scholar: https://scholar.google.com/citations?user=xX99V40AAAAJ
  orcid: https://orcid.org/0000-0001-9553-5259
  linkedin: https://www.linkedin.com/in/simone-latini
  github: https://github.com/nautasimola

# Main navigation (order shown in the header)
nav:
  - title: Research
    url: /projects/
  - title: People
    url: /people/
  - title: Publications
    url: /publications/
  - title: News
    url: /news/
  - title: Teaching
    url: /teaching/
  - title: Join us
    url: /join/

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    output: false
  people:
    output: false
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
markdown: kramdown
permalink: /blog/:year/:title/

plugins:
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-feed

sass:
  style: compressed

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - .jekyll-cache

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar)
# -----------------------------------------------------------------------------
scholar:
  last_name: [Latini]
  first_name: [Simone, S.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"

max_author_limit: 6
